<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>会計アプリ</title>

  <link rel="stylesheet"
        href="style.css">
</head>
<body>

<div class="container">

  <h1>売上管理アプリ</h1>

  <div class="tabs">
    <button
      type="button"
      onclick="showTab('input')"
    >
      入力
    </button>

    <button
      type="button"
      onclick="showTab('balance')"
    >
      残高
    </button>
  </div>

  <div
    id="input-tab"
    class="tab-content"
  >

    <div class="card form-card">

      <input
        type="text"
        id="title"
        placeholder="商品名"
      >

      <input
        type="number"
        id="amount"
        placeholder="商品の値段"
      >

      <div class="count-box">

        <button
          type="button"
          onclick="changeCount(-1)"
        >
          −
        </button>

        <span id="count">
          1
        </span>

        <button
          type="button"
          onclick="changeCount(1)"
        >
          ＋
        </button>

      </div>

      <button id="addBtn">
        追加
      </button>

    </div>

  </div>

  <div
    id="balance-tab"
    class="tab-content hidden"
  >

    <div class="card">

      <h2>現在の売上</h2>

      <div id="balance">
        0円
      </div>

      <ul id="list"></ul>

    </div>

  </div>

</div>

<script>

function showTab(tab){

  document
    .getElementById("input-tab")
    .classList
    .add("hidden");

  document
    .getElementById("balance-tab")
    .classList
    .add("hidden");

  document
    .getElementById(`${tab}-tab`)
    .classList
    .remove("hidden");
}

</script>

<script
  type="module"
  src="script.js"
></script>

</body>
</html>
