<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>売上管理アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>売上管理アプリ</h1>

  <div class="tabs">
    <button id="tab-input">入力</button>
    <button id="tab-history">履歴</button>
  </div>

  <section id="input-tab">

    <div class="product-block">
      <h3>プレーン味</h3>
      <input type="number" id="price-plain" placeholder="価格">
      <div class="count-box">
        <button type="button" class="minus" data-key="plain">−</button>
        <span id="count-plain">0</span>
        <button type="button" class="plus" data-key="plain">＋</button>
      </div>
    </div>

    <div class="product-block">
      <h3>ストロベリー味</h3>
      <input type="number" id="price-strawberry" placeholder="価格">
      <div class="count-box">
        <button type="button" class="minus" data-key="strawberry">−</button>
        <span id="count-strawberry">0</span>
        <button type="button" class="plus" data-key="strawberry">＋</button>
      </div>
    </div>

    <div class="product-block">
      <h3>ココア味</h3>
      <input type="number" id="price-cocoa" placeholder="価格">
      <div class="count-box">
        <button type="button" class="minus" data-key="cocoa">−</button>
        <span id="count-cocoa">0</span>
        <button type="button" class="plus" data-key="cocoa">＋</button>
      </div>
    </div>

    <div class="product-block">
      <h3>抹茶味</h3>
      <input type="number" id="price-matcha" placeholder="価格">
      <div class="count-box">
        <button type="button" class="minus" data-key="matcha">−</button>
        <span id="count-matcha">0</span>
        <button type="button" class="plus" data-key="matcha">＋</button>
      </div>
    </div>

    <button id="addBtn">追加</button>

    <div class="total-box">
      <p>追加前の金額</p>
      <div id="previewTotal">0円</div>
    </div>

  </section>

  <section id="history-tab" class="hidden">

    <div class="total-box">
      <p>現在の合計</p>
      <div id="balance">0円</div>
    </div>

    <ul id="list"></ul>

  </section>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
